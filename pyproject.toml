[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mecanumbot-bag-converter"
version = "0.1.0"
description = "Convert MecanumBot ROS 2 bags: RViz visualisation -> .mp4, image topics -> image files"
requires-python = ">=3.10"
# rosbag2_py, rclpy and rosidl_runtime_py come from the sourced ROS 2 Humble install.
dependencies = ["numpy", "opencv-python", "PyYAML"]

[project.scripts]
bag_convert = "bag_converter.cli:main"

[tool.setuptools]
packages = ["bag_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]
